views:
  - title: Boiler
    path: 'n'
    badges: []
    cards:
      - type: entities
        entities:
          - entity: input_number.heating_pause_hrs_all
            name: Pause all heating time (hrs)
          - entity: input_button.pause_run_all
          - entity: input_button.cancel_pause_run_all
        title: Pause all
      - type: entities
        entities:
          - entity: input_number.boost_time_boiler
            name: Boost boiler time (minutes)
          - entity: input_button.boost_boiler
        title: Boost boiler
  - title: Livingroom
    badges: []
    cards:
      - type: entity
        entity: climate.lumi_lumi_airrtc_agl001_thermostat_2
        attribute: current_temperature
        unit: C
      - type: entities
        entities:
          - entity: input_number.schedule_target_temp_livingroom
