        title: 'Target temperature '
      - type: entities
        entities:
          - entity: input_number.heating_pause_hrs_livingroom
          - entity: input_button.pause_run_livingroom
          - entity: input_button.cancel_pause_run_livingroom
        title: 'Pause heating '
      - type: entities
        entities:
          - entity: input_number.boost_time_livingroom
